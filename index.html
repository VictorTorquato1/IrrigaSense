<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>IrrigaSense - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="topbar">
        <div class="brand">IrrigaSense</div>
        <nav class="main-nav">
            <a href="#dashboard">Dashboard</a>
            <a href="#controles">Controles</a>
            <a href="#alertas">Alertas</a>
        </nav>
    </header>

    <main class="container">

        <!-- Área de conexão -->
        <section class="card" id="conexao">
            <h2>Conexão</h2>
            <div class="row">
                <button id="conectarESP32" class="btn primary">Conectar ESP32</button>
                <div class="status">
                    <span id="statusESP32" class="status-pill desconectado">ESP32 desconectado</span>
                </div>
            </div>
            <div class="error" id="mensagemErro"></div>
        </section>

        <!-- Controles principais -->
        <section class="grid" id="controles">

            <div class="card">
                <h3>Bomba</h3>
                <p id="statusBomba">Bomba desligada</p>
                <div class="row">
                    <button id="ligarBomba" class="btn success">Ligar</button>
                    <button id="desligarBomba" class="btn danger">Desligar</button>
                </div>
            </div>

            <div class="card">
                <h3>Vazão</h3>
                <p class="lead" id="vazao">0.00 L/min</p>
                <p>Água usada: <span id="aguaUsada">0.00 L</span></p>
                <p id="estadoVazao" class="muted">Estado: —</p>
            </div>

            <div class="card">
                <h3>Sessão</h3>
                <p>Início: <span id="inicioSessao">—</span></p>
                <p>Tempo: <span id="tempoSessao">00:00:00</span></p>
            </div>

        </section>

        <!-- Limites de vazão e gráficos -->
        <section class="grid">

            <div class="card">
                <h3>Limites de Vazão</h3>
                <form id="formLimites" class="form-inline" onsubmit="event.preventDefault();">
                    <label for="vazaoMinima">Vazão mínima (L/min)</label>
                    <input id="vazaoMinima" type="number" step="0.01" min="0" />

                    <label for="vazaoMaxima">Vazão máxima (L/min)</label>
                    <input id="vazaoMaxima" type="number" step="0.01" min="0" />

                    <button id="salvarLimites" class="btn">Salvar</button>
                </form>
            </div>

            <div class="card" id="graficoCard">
                <h3>Gráfico de Vazão</h3>
                <!-- Espaço para o gráfico; o script atual não injeta nada aqui, mas deixamos o elemento -->
                <div class="chart-wrap">
                    <canvas id="graficoVazao" width="400" height="200"></canvas>
                </div>
            </div>

        </section>

        <!-- Alertas -->
        <section class="card" id="alertas">
            <h2>Alertas</h2>
            <div id="alertaAtual" class="alert alerta-atual">Nenhum alerta</div>
            <div id="alertasRecentes" class="alert-list">
                <!-- recentes serão listados aqui -->
            </div>
        </section>

    </main>

    <footer class="footer">
        <small>IrrigaSense — Monitoramento de irrigação</small>
    </footer>

    <script src="JS/script.js"></script>
</body>
</html>
